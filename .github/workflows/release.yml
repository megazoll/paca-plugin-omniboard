name: Build and Release Plugin Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build backend WASM
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p ../release/backend
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o ../release/backend/backend.wasm .

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          bun install
          bun run build

      - name: Build MCP
        working-directory: mcp
        run: |
          set -euo pipefail
          bun install
          bun run build

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release/frontend
          cp -R frontend/dist release/frontend/dist

          mkdir -p release/mcp
          cp -R mcp/dist release/mcp/dist

          mkdir -p release/migrations
          cp -R backend/migrations/. release/migrations/

          mkdir -p release/skills
          cp -R skills/. release/skills/

          cp plugin.json release/plugin.json

      - name: Create archives
        run: |
          set -euo pipefail
          tar -czf omniboard-backend-wasm.tar.gz -C release/backend backend.wasm
          tar -czf omniboard-frontend-dist.tar.gz -C release/frontend dist
          tar -czf omniboard-mcp-dist.tar.gz -C release/mcp dist
          tar -czf omniboard-migrations.tar.gz -C release migrations
          tar -czf omniboard-skills-bundle.tar.gz -C release skills
          tar -czf omniboard-plugin-manifest.tar.gz -C release plugin.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum omniboard-backend-wasm.tar.gz \
            omniboard-frontend-dist.tar.gz \
            omniboard-mcp-dist.tar.gz \
            omniboard-migrations.tar.gz \
            omniboard-skills-bundle.tar.gz \
            omniboard-plugin-manifest.tar.gz > checksums.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            omniboard-backend-wasm.tar.gz
            omniboard-frontend-dist.tar.gz
            omniboard-mcp-dist.tar.gz
            omniboard-migrations.tar.gz
            omniboard-skills-bundle.tar.gz
            omniboard-plugin-manifest.tar.gz
            checksums.txt
